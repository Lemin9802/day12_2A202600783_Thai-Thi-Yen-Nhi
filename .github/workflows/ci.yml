name: Production checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python scripts/validate_dataset_manifest.py
      - run: pytest -q
        env:
          ENVIRONMENT: development
          LLM_PROVIDER: none
          MAITHUYLAW_SESSION_SECRET: ci-session-secret
          MAITHUYLAW_RATE_LIMIT_PER_MINUTE: "1000"
          MAITHUYLAW_DAILY_LIMIT: "5000"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - name: Build production image
        run: docker build -t maithuylaw-ci .
