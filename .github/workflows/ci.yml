name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  day12-lab:
    name: Day 12 lab checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: development
      AGENT_API_KEY: ci-lab-key
      REDIS_URL: redis://127.0.0.1:6399/0
      RATE_LIMIT_PER_MINUTE: "1000"
      MONTHLY_BUDGET_USD: "10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app utils
      - name: Smoke test lab API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get('/health').status_code == 200
              assert client.get('/ready').status_code == 200
              assert client.post('/ask', json={'question': 'Hello'}).status_code == 401
              response = client.post(
                  '/ask',
                  headers={'X-API-Key': 'ci-lab-key'},
                  json={'user_id': 'ci-user', 'question': 'Hello'},
              )
              assert response.status_code == 200, response.text
          PY
      - name: Build lab image
        run: docker build -t day12-lab-ci .

  maithuylaw-ai:
    name: MaiThuyLaw AI production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: development
      LLM_PROVIDER: none
      MAITHUYLAW_SESSION_SECRET: ci-session-secret
      MAITHUYLAW_RATE_LIMIT_PER_MINUTE: "1000"
      MAITHUYLAW_DAILY_LIMIT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: maithuylaw-ai/requirements.txt
      - working-directory: maithuylaw-ai
        run: pip install -r requirements.txt
      - working-directory: maithuylaw-ai
        run: python -m compileall -q backend scripts tests
      - working-directory: maithuylaw-ai
        run: python scripts/validate_dataset_manifest.py
      - working-directory: maithuylaw-ai
        run: python scripts/evaluate_retrieval.py
      - working-directory: maithuylaw-ai
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: maithuylaw-ai/frontend/package-lock.json
      - working-directory: maithuylaw-ai/frontend
        run: npm ci
      - working-directory: maithuylaw-ai/frontend
        run: npm run build
      - working-directory: maithuylaw-ai/frontend
        run: npm audit --audit-level=moderate
      - name: Build product image
        run: docker build -t maithuylaw-ci maithuylaw-ai
      - name: Run product image
        run: |
          docker run -d --name maithuylaw-ci-app -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e LLM_PROVIDER=none \
            -e MAITHUYLAW_SESSION_SECRET=ci-session-secret \
            -e MAITHUYLAW_API_KEY=ci-smoke-key \
            -e MAITHUYLAW_RATE_LIMIT_PER_MINUTE=1000 \
            -e MAITHUYLAW_DAILY_LIMIT=5000 \
            maithuylaw-ci
      - name: Smoke test product image
        working-directory: maithuylaw-ai
        env:
          MAITHUYLAW_BASE_URL: http://127.0.0.1:8000
          MAITHUYLAW_API_KEY: ci-smoke-key
        run: python scripts/smoke_test_backend.py
      - name: Container logs on failure
        if: failure()
        run: docker logs maithuylaw-ci-app || true
      - name: Stop product image
        if: always()
        run: docker rm -f maithuylaw-ci-app || true
